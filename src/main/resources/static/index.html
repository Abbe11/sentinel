<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel — FHIR Claim Validator</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2dd4bf;--err:#f85149;--warn:#d29922;--ok:#3fb950;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:24px 32px;border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:32px;max-width:1100px;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  textarea{width:100%;height:280px;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical}
  .row{display:flex;gap:10px;margin-top:12px}
  button{background:var(--accent);color:#08211d;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  button:hover{opacity:.9}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .badge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border)}
  .badge.ok{background:rgba(63,185,80,.15);color:var(--ok);border-color:var(--ok)}
  .badge.bad{background:rgba(248,81,73,.15);color:var(--err);border-color:var(--err)}
  .badge.neutral{background:transparent;color:var(--muted)}
  .issue{border-left:3px solid var(--muted);padding:8px 12px;margin-bottom:8px;background:#0d1117;border-radius:0 6px 6px 0;font-size:13px}
  .issue.ERROR{border-color:var(--err)}
  .issue.WARNING{border-color:var(--warn)}
  .issue.INFORMATION{border-color:var(--accent)}
  .issue .sev{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .issue.ERROR .sev{color:var(--err)}
  .issue.WARNING .sev{color:var(--warn)}
  .issue .loc{color:var(--muted);font-family:ui-monospace,monospace;font-size:12px;margin:2px 0}
  .placeholder{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <h1><span>Sentinel</span> — FHIR Claim Validator</h1>
  <p>NPHIES / FHIR R4 pre-submission validation · catch broken claims before a payer rejects them</p>
</header>
<main>
  <section class="card">
    <h2>Claim (FHIR R4 JSON)</h2>
    <textarea id="input"></textarea>
    <div class="row">
      <button onclick="validate()">Validate claim</button>
      <button class="ghost" onclick="loadSample()">Load sample</button>
    </div>
  </section>
  <section class="card">
    <h2>Result</h2>
    <div id="badges" class="badges"></div>
    <div id="issues"><p class="placeholder">Submit a claim to see validation results.</p></div>
  </section>
</main>
<script>
var SAMPLE = {resourceType:"Claim", id:"claim-001", status:"active"};
function loadSample(){ document.getElementById('input').value = JSON.stringify(SAMPLE, null, 2); }
loadSample();
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
async function validate(){
  var badges = document.getElementById('badges');
  var issues = document.getElementById('issues');
  badges.innerHTML = ''; issues.innerHTML = '<p class="placeholder">Validating…</p>';
  var res, data;
  try{
    res = await fetch('/fhir/validate', {method:'POST', headers:{'Content-Type':'application/json'}, body: document.getElementById('input').value});
    data = await res.json();
  }catch(e){ issues.innerHTML = '<p class="placeholder">Request failed: ' + e + '</p>'; return; }
  if(data.parsed === false){
    badges.innerHTML = '<span class="badge bad">Did not parse</span>';
    issues.innerHTML = '<div class="issue ERROR"><div class="sev">Parse error</div><div>' + escapeHtml(data.error||'') + '</div></div>';
    return;
  }
  var html = '<span class="badge ok">Parsed</span>';
  if('valid' in data){ html += data.valid ? '<span class="badge ok">Valid</span>' : '<span class="badge bad">Invalid</span>'; }
  if('issueCount' in data){ html += '<span class="badge neutral">' + data.issueCount + ' issue(s)</span>'; }
  badges.innerHTML = html;
  var list = data.issues || [];
  if(list.length === 0){ issues.innerHTML = '<p class="placeholder">No structural issues found.</p>'; return; }
  issues.innerHTML = list.map(function(i){
    return '<div class="issue ' + (i.severity||'') + '"><div class="sev">' + (i.severity||'') + '</div>' +
      (i.location ? '<div class="loc">' + escapeHtml(i.location) + '</div>' : '') +
      '<div>' + escapeHtml(i.message||'') + '</div></div>';
  }).join('');
}
</script>
</body>
</html>
